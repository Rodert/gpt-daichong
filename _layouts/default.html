<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="keywords" content="{{ page.keywords | default: site.keywords | join: ', ' | escape }}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.schema_type == 'BlogPosting' %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    {% if page.schema_type == 'BlogPosting' %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    <meta property="article:modified_time" content="{{ page.updated | default: page.date | date_to_xmlschema }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": {{ page.title | jsonify }},
        "description": {{ page.description | jsonify }},
        "datePublished": "{{ page.date | date_to_xmlschema }}",
        "dateModified": "{{ page.updated | default: page.date | date_to_xmlschema }}",
        "mainEntityOfPage": {"@type": "WebPage", "@id": "{{ page.url | absolute_url }}"},
        "author": {"@type": "Organization", "name": {{ site.title | jsonify }}},
        "publisher": {"@type": "Organization", "name": {{ site.title | jsonify }}}
      }
    </script>
    {% endif %}
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      :root{--fg:#24292f;--muted:#57606a;--link:#0969da;--border:#d0d7de;--bg:#fff;--code:#f6f8fa}
      *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);line-height:1.75;font-size:16px}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:760px;margin:0 auto;padding:0 20px}.site-header{border-bottom:1px solid var(--border)}.nav{display:flex;align-items:center;justify-content:space-between;min-height:56px}.brand{font-weight:600;font-size:15px;color:var(--fg)}.brand-mark{display:none}.nav-links{display:flex;gap:18px;font-size:14px}.nav-links a{color:var(--muted)}main{padding:32px 0 48px;min-height:calc(100vh - 142px)}h1,h2,h3{line-height:1.35;letter-spacing:0}main h1:first-child{margin-top:0}h1{font-size:1.75em;margin:1.2em 0 .7em}h2{font-size:1.35em;margin-top:1.8em;border-bottom:1px solid var(--border);padding-bottom:.3em}h3{font-size:1.12em;margin-top:1.5em}p{margin:1em 0}img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:6px}blockquote,.notice{margin:1em 0;padding:.4em 1em;color:var(--muted);border-left:4px solid var(--border);background:var(--code);border-radius:0 6px 6px 0}.notice p{margin:.4em 0}table{border-collapse:collapse;margin:1em 0;display:block;overflow-x:auto}th,td{border:1px solid var(--border);padding:6px 12px;text-align:left;white-space:nowrap}th{background:var(--code)}code{background:var(--code);padding:.15em .4em;border-radius:4px;font-size:.9em}ul,ol{padding-left:1.4em}.article-image{display:block;width:100%;margin:1.5em 0}.post-meta{color:var(--muted);font-size:14px;margin:-.3em 0 1.6em}.post-list{list-style:none;padding:0;margin:1.5em 0}.post-list li{padding:18px 0;border-bottom:1px solid var(--border)}.post-list li:first-child{border-top:1px solid var(--border)}.post-list a{font-weight:600;font-size:1.08em}.post-list p{margin:.25em 0 0;color:var(--muted);font-size:15px}.site-footer{border-top:1px solid var(--border);color:var(--muted);font-size:14px;padding:24px 0}.footer-row{display:block}.footer-row p{margin:.25em 0}.footer-row p:last-child{margin-top:.8em}@media(max-width:560px){.shell{padding:0 16px}main{padding-top:26px}h1{font-size:1.55em}}
    </style>
  </head>
  <body>
    <header class="site-header"><div class="shell nav"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a><nav class="nav-links" aria-label="主导航"><a href="{{ '/blog/' | relative_url }}">博客</a></nav></div></header>
    <main class="shell">{{ content }}</main>
    <footer class="site-footer"><div class="shell footer-row"><p>本站提供信息整理，不代表 OpenAI，也不保证第三方服务的持续可用性。购买前请自行核验套餐、价格、退款与售后条款。</p><p>订阅服务入口：<a href="{{ site.recommended_url }}" rel="nofollow sponsored noopener" target="_blank">{{ site.recommended_name }}</a> · <a href="{{ '/' | relative_url }}">返回首页</a></p></div></footer>
  </body>
</html>
